<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Built with .NET MAUI</title>
    <script>
        // GitHub Pages SPA fallback: stash the requested path and bounce to the app root.
        (function () {
            var base = document.querySelector('base');
            var basePath = base ? base.getAttribute('href') : '/';
            sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
            location.replace(basePath);
        })();
    </script>
</head>
<body></body>
</html>
